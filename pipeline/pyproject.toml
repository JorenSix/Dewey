[project]
name = "connectome-fly-pipeline"
version = "0.1.0"
description = "Builds the reduced fly circuit (circuit.json) from the FlyEM male-CNS v1.0 connectome"
requires-python = ">=3.11"
dependencies = ["pyarrow>=15", "pandas>=2.1", "pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
